<!-- Three.js r168 ESM via importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap');

:root{
  --ink:#0f0e0d;
  --paper:#f5f2ee;
  --cream:#ede8e0;
  --accent:#d4500a;
  --accent2:#2c6e49;
  --muted:#9c9082;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh;background:var(--paper);color:var(--ink);font-family:'DM Mono',monospace}

/* ── GRAIN overlay ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.45;
}

/* ── LAYOUT ── */
.app{max-width:480px;margin:0 auto;padding:0 0 80px}

/* ── HEADER ── */
header{
  padding:52px 24px 24px;
  border-bottom:1px solid rgba(0,0,0,.1);
}
.logo{font-family:'DM Serif Display',serif;font-size:36px;line-height:1;letter-spacing:-.5px}
.logo em{color:var(--accent);font-style:normal}
.sub{font-size:10px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}

/* ── SECTION ── */
.section{padding:28px 24px 0}
.section-label{
  font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.1)}

/* ── TEXT INPUT ── */
.text-field{
  background:#fff;border:1.5px solid rgba(0,0,0,.12);border-radius:var(--r);
  padding:16px 18px;width:100%;
  font-family:'DM Mono',monospace;font-size:20px;
  color:var(--ink);outline:none;transition:border-color .2s;
  appearance:none;-webkit-appearance:none;
}
.text-field:focus{border-color:var(--accent)}
.text-field::placeholder{color:var(--muted);font-size:16px}

/* ── CONTROLS ROW ── */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* ── CHIP GROUP ── */
.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:var(--cream);border:1.5px solid rgba(0,0,0,.1);border-radius:50px;
  font-family:'DM Mono',monospace;font-size:11px;padding:6px 14px;cursor:pointer;
  transition:all .18s;color:var(--ink);
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ── COLOR DOTS ── */
.color-dots{display:flex;gap:8px;align-items:center}
.dot{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform .15s,border-color .15s;
}
.dot.active{border-color:var(--ink);transform:scale(1.15)}

/* ── SLIDER ── */
.slider-wrap{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px}
.slider-wrap label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);width:32px}
input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.slider-val{font-size:11px;color:var(--accent);min-width:28px;text-align:right}

/* ── PREVIEW CANVAS ── */
.preview-wrap{
  margin:20px 24px 0;
  background:var(--cream);
  border:1.5px solid rgba(0,0,0,.1);
  border-radius:var(--r);overflow:hidden;
  position:relative;
}
#preview-canvas{width:100%;aspect-ratio:1;display:block}
.preview-label{
  position:absolute;bottom:10px;left:12px;
  font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
}

/* ── AR BUTTON ── */
.ar-btn-wrap{padding:24px 24px 0}
#ar-btn{
  width:100%;padding:18px;
  background:var(--accent);color:#fff;
  border:none;border-radius:var(--r);
  font-family:'DM Serif Display',serif;font-size:20px;
  cursor:pointer;transition:transform .15s,filter .15s;
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;
}
#ar-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);
  pointer-events:none;
}
#ar-btn:active{transform:scale(.98);filter:brightness(.92)}
#ar-btn:disabled{background:var(--muted);cursor:not-allowed}
.ar-icon{font-size:22px}

/* ── PROGRESS ── */
#progress-wrap{
  padding:0 24px;margin-top:16px;display:none;
}
.progress-bar-bg{
  height:4px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden;
}
.progress-bar{
  height:100%;background:var(--accent);border-radius:2px;width:0%;
  transition:width .3s ease;
}
.progress-label{font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:1px}

/* ── NOTE ── */
.note{
  margin:16px 24px 0;font-size:10px;color:var(--muted);line-height:1.7;
  padding:12px 14px;background:var(--cream);border-radius:10px;
  border-left:3px solid var(--accent2);
}
.note strong{color:var(--ink)}

/* ── TAB BAR ── */
.tab-bar{
  display:flex;gap:0;
  margin:24px 24px 0;
  background:var(--cream);border-radius:var(--r);
  padding:4px;border:1.5px solid rgba(0,0,0,.08);
}
.tab{
  flex:1;padding:10px 0;text-align:center;
  font-size:11px;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;border-radius:10px;
  color:var(--muted);transition:all .2s;
}
.tab.active{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1)}

.panel{display:none}.panel.active{display:block}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">AR<em>.</em>Studio</div>
    <div class="sub">iPhone AR Quick Look</div>
  </header>

  <!-- TABS -->
  <div class="tab-bar">
    <div class="tab active" data-tab="text" onclick="switchTab('text')">📝 テキスト</div>
    <div class="tab" data-tab="shape" onclick="switchTab('shape')">🔷 図形</div>
  </div>

  <!-- ── TEXT PANEL ── -->
  <div id="panel-text" class="panel active">

    <div class="section">
      <div class="section-label">テキスト</div>
      <input class="text-field" id="txt" type="text" placeholder="Hello AR!" maxlength="20"
             oninput="schedulePreview()" />
    </div>

    <div class="section">
      <div class="section-label">フォント</div>
      <div class="chip-group" id="font-chips">
        <div class="chip active" data-font="helvetiker">Sans</div>
        <div class="chip" data-font="optimer">Serif</div>
        <div class="chip" data-font="gentilis">Gentilis</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">カラー</div>
      <div class="color-dots" id="text-colors">
        <div class="dot active" style="background:#d4500a" data-color="#d4500a"></div>
        <div class="dot" style="background:#2c6e49" data-color="#2c6e49"></div>
        <div class="dot" style="background:#1a1a2e" data-color="#1a1a2e"></div>
        <div class="dot" style="background:#e8c547" data-color="#e8c547"></div>
        <div class="dot" style="background:#c084fc" data-color="#c084fc"></div>
        <div class="dot" style="background:#f5f5f5" data-color="#f5f5f5" style="border:1px solid #ccc"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">サイズ / 深さ</div>
      <div class="slider-wrap">
        <label>SIZE</label>
        <input type="range" id="txt-size" min="0.05" max="0.5" step="0.01" value="0.15" oninput="onSlider(this,'tsz')"/>
        <span class="slider-val" id="tsz">0.15</span>
      </div>
      <div class="slider-wrap" style="margin-top:8px">
        <label>DEPTH</label>
        <input type="range" id="txt-depth" min="0.01" max="0.15" step="0.005" value="0.04" oninput="onSlider(this,'tdp')"/>
        <span class="slider-val" id="tdp">0.040</span>
      </div>
    </div>

  </div><!-- /panel-text -->

  <!-- ── SHAPE PANEL ── -->
  <div id="panel-shape" class="panel">

    <div class="section">
      <div class="section-label">図形</div>
      <div class="chip-group" id="shape-chips">
        <div class="chip active" data-shape="box">📦 Box</div>
        <div class="chip" data-shape="sphere">🔵 Sphere</div>
        <div class="chip" data-shape="cylinder">🥫 Cylinder</div>
        <div class="chip" data-shape="cone">🔺 Cone</div>
        <div class="chip" data-shape="torus">⭕ Torus</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">カラー</div>
      <div class="color-dots" id="shape-colors">
        <div class="dot active" style="background:#2c6e49" data-color="#2c6e49"></div>
        <div class="dot" style="background:#d4500a" data-color="#d4500a"></div>
        <div class="dot" style="background:#1a1a2e" data-color="#1a1a2e"></div>
        <div class="dot" style="background:#e8c547" data-color="#e8c547"></div>
        <div class="dot" style="background:#c084fc" data-color="#c084fc"></div>
        <div class="dot" style="background:#e0e0e0" data-color="#e0e0e0"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">サイズ</div>
      <div class="slider-wrap">
        <label>SIZE</label>
        <input type="range" id="shp-size" min="0.1" max="1.0" step="0.05" value="0.4" oninput="onSlider(this,'ssz')"/>
        <span class="slider-val" id="ssz">0.40</span>
      </div>
    </div>

  </div><!-- /panel-shape -->

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <canvas id="preview-canvas"></canvas>
    <div class="preview-label">3D PREVIEW</div>
  </div>

  <!-- AR BUTTON -->
  <div class="ar-btn-wrap">
    <button id="ar-btn" onclick="generateAndLaunch()">
      <span class="ar-icon">📷</span>
      ARで見る
    </button>
  </div>

  <!-- PROGRESS -->
  <div id="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="progress-label" id="prog-label">USDZ を生成中…</div>
  </div>

  <!-- NOTE -->
  <div class="note">
    <strong>使い方：</strong><br>
    ① テキストまたは図形をカスタマイズ<br>
    ② 「ARで見る」をタップ → USDZを生成<br>
    ③ iOSのAR Quick Lookが起動<br>
    ④ 床にタップしてオブジェクトを配置！<br><br>
    ⚠️ iPhoneのSafariで開いてください
  </div>

</div><!-- /app -->

<!-- ════════════════════════════════════
     THREE.JS + USDZ LOGIC
════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ── Preview renderer ────────────────────────────────────
const canvas = document.getElementById('preview-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
cam.position.set(0, 0.6, 2.2);
cam.lookAt(0, 0, 0);

// Lights
const amb = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(2, 4, 3);
dir.castShadow = true;
scene.add(dir);
const fill = new THREE.PointLight(0xffeedd, 0.8, 10);
fill.position.set(-2, 1, -1);
scene.add(fill);

let previewMesh = null;
let frameId = null;

function resizeRenderer() {
  const w = canvas.parentElement.clientWidth;
  renderer.setSize(w, w, false);
  cam.aspect = 1;
  cam.updateProjectionMatrix();
}
resizeRenderer();
new ResizeObserver(resizeRenderer).observe(canvas.parentElement);

function animate() {
  frameId = requestAnimationFrame(animate);
  if (previewMesh) previewMesh.rotation.y += 0.008;
  renderer.render(scene, cam);
}
animate();

// ── State ───────────────────────────────────────────────
let state = {
  mode: 'text',
  text: 'Hello AR!',
  font: 'helvetiker',
  textColor: '#d4500a',
  textSize: 0.15,
  textDepth: 0.04,
  shape: 'box',
  shapeColor: '#2c6e49',
  shapeSize: 0.4,
};

window.appState = state;

// ── Font cache ───────────────────────────────────────────
const fontLoader = new FontLoader();
const fontCache = {};

const FONT_URLS = {
  helvetiker: 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',
  optimer:    'https://threejs.org/examples/fonts/optimer_regular.typeface.json',
  gentilis:   'https://threejs.org/examples/fonts/gentilis_regular.typeface.json',
};

async function loadFont(name) {
  if (fontCache[name]) return fontCache[name];
  return new Promise((res, rej) => {
    fontLoader.load(FONT_URLS[name], f => { fontCache[name] = f; res(f); }, undefined, rej);
  });
}

// ── Build preview scene object ───────────────────────────
async function buildObject(forExport = false) {
  if (previewMesh) { scene.remove(previewMesh); previewMesh.geometry?.dispose(); }

  let geo, mat;

  if (state.mode === 'text') {
    const font = await loadFont(state.font);
    const txt = state.text.trim() || 'AR';
    geo = new TextGeometry(txt, {
      font,
      size:  state.textSize,
      depth: state.textDepth,
      curveSegments: forExport ? 6 : 10,
      bevelEnabled: true,
      bevelThickness: state.textDepth * 0.15,
      bevelSize: state.textSize * 0.03,
      bevelSegments: forExport ? 2 : 4,
    });
    geo.computeBoundingBox();
    const cx = -(geo.boundingBox.max.x - geo.boundingBox.min.x) / 2;
    geo.translate(cx, 0, 0);
    mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(state.textColor),
      roughness: 0.35,
      metalness: 0.1,
    });

  } else {
    const s = state.shapeSize;
    switch(state.shape) {
      case 'box':      geo = new THREE.BoxGeometry(s, s, s); break;
      case 'sphere':   geo = new THREE.SphereGeometry(s/2, 32, 24); break;
      case 'cylinder': geo = new THREE.CylinderGeometry(s/2, s/2, s, 32); break;
      case 'cone':     geo = new THREE.ConeGeometry(s/2, s, 32); break;
      case 'torus':    geo = new THREE.TorusGeometry(s/2, s/6, 16, 60); break;
      default:         geo = new THREE.BoxGeometry(s, s, s);
    }
    mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(state.shapeColor),
      roughness: 0.3,
      metalness: 0.2,
    });
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  if (!forExport) {
    previewMesh = mesh;
    scene.add(mesh);
  }
  return mesh;
}

// ── Initial preview ──────────────────────────────────────
buildObject();

// ── Schedule debounced preview rebuild ──────────────────
let previewTimer = null;
window.schedulePreview = () => {
  state.text = document.getElementById('txt').value || 'AR';
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => buildObject(), 300);
};

// ── Slider helper ────────────────────────────────────────
window.onSlider = (el, spanId) => {
  const v = parseFloat(el.value);
  document.getElementById(spanId).textContent = v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  if (el.id === 'txt-size')  state.textSize  = v;
  if (el.id === 'txt-depth') state.textDepth = v;
  if (el.id === 'shp-size')  state.shapeSize = v;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => buildObject(), 200);
};

// ── Tab switch ───────────────────────────────────────────
window.switchTab = (tab) => {
  state.mode = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => buildObject(), 100);
};

// ── Chip / dot event delegation ──────────────────────────
function setupChips(groupId, key, rebuild = true) {
  document.getElementById(groupId)?.addEventListener('click', e => {
    const chip = e.target.closest('[data-' + key.split('.')[0] + ']');
    if (!chip) return;
    document.querySelectorAll('#' + groupId + ' .chip, #' + groupId + ' .dot')
      .forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const val = chip.dataset[key.split('.')[0]] || chip.dataset[Object.keys(chip.dataset)[0]];
    if (key === 'font')  state.font = val;
    if (key === 'shape') state.shape = val;
    if (key === 'color' && groupId === 'text-colors')  state.textColor  = val;
    if (key === 'color' && groupId === 'shape-colors') state.shapeColor = val;
    if (rebuild) { clearTimeout(previewTimer); previewTimer = setTimeout(() => buildObject(), 150); }
  });
}
setupChips('font-chips',    'font');
setupChips('shape-chips',   'shape');
setupChips('text-colors',   'color');
setupChips('shape-colors',  'color');

// ── Progress helpers ─────────────────────────────────────
function setProgress(pct, label) {
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = label;
}
function showProgress(show) {
  document.getElementById('progress-wrap').style.display = show ? 'block' : 'none';
}

// ── Generate USDZ & launch AR ────────────────────────────
window.generateAndLaunch = async () => {
  const btn = document.getElementById('ar-btn');
  btn.disabled = true;
  showProgress(true);
  setProgress(10, 'オブジェクトを構築中…');

  try {
    // Build export scene (separate from preview)
    const exportScene = new THREE.Scene();
    const exportMesh = await buildObject(true);

    // Position mesh above floor (y=0 is floor in AR Quick Look)
    exportMesh.position.set(0, 0, 0);
    exportScene.add(exportMesh);

    // Lights for export
    exportScene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dl = new THREE.DirectionalLight(0xffffff, 2);
    dl.position.set(2, 4, 3);
    exportScene.add(dl);

    setProgress(35, 'USDZエクスポーター準備中…');
    await new Promise(r => setTimeout(r, 50));

    const exporter = new USDZExporter();
    setProgress(60, 'USDZ生成中（少し時間がかかります）…');
    await new Promise(r => setTimeout(r, 50));

    const arraybuffer = await exporter.parseAsync(exportScene, {
      quickLookCompatible: true,
      maxTextureSize: 512,
    });

    setProgress(90, 'ダウンロードリンクを作成中…');

    // Create blob URL
    const blob = new Blob([arraybuffer], { type: 'model/vnd.usdz+zip' });
    const url  = URL.createObjectURL(blob);

    setProgress(100, '完了！ARを開いています…');
    await new Promise(r => setTimeout(r, 200));

    // iOS AR Quick Look trigger:
    // Must be an <a> with rel="ar" wrapping an image, with href pointing to .usdz
    const anchor = document.createElement('a');
    anchor.setAttribute('rel', 'ar');
    anchor.setAttribute('href', url);
    anchor.appendChild(document.createElement('img')); // required by iOS
    anchor.style.display = 'none';
    document.body.appendChild(anchor);
    anchor.click();

    // Cleanup after delay
    setTimeout(() => {
      URL.revokeObjectURL(url);
      document.body.removeChild(anchor);
    }, 5000);

  } catch(err) {
    console.error('USDZ error:', err);
    alert('エラーが発生しました。\n' + err.message + '\n\nSafariで開いているか確認してください。');
  } finally {
    btn.disabled = false;
    showProgress(false);
  }
};

// ── Init slider display values ───────────────────────────
document.getElementById('tsz').textContent = '0.15';
document.getElementById('tdp').textContent = '0.04';
document.getElementById('ssz').textContent = '0.40';
</script>
</body>
</html>
